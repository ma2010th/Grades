<html lang="ar" dir="rtl">

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 50%, #bcccdc 100%);
            background-attachment: fixed;
            color: #102a43;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(rgba(13, 148, 136, 0.05) 1px, transparent 1px),
                radial-gradient(rgba(0, 47, 108, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 4px solid #f59e0b;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
            width: 100%;
            max-width: 650px;
            padding: 45px 35px;
            text-align: center;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #002f6c;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.05rem;
            color: #486581;
            margin-bottom: 25px;
            font-weight: 700;
        }
        
        .exam-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .exam-btn {
            flex: 1;
            padding: 12px 10px;
            background: #f8fafc;
            border: 2.5px solid #cbd5e1;
            border-radius: 16px;
            color: #486581;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .exam-btn span.icon {
            font-size: 1.2rem;
            padding: 6px;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        #btnMath .icon {
            background: rgba(13, 148, 136, 0.12);
            color: #0d9488;
        }

        #btnMath.active {
            background: linear-gradient(135deg, #f0fdfa, #ccfbf1);
            border-color: #0d9488;
            color: #115e59;
            box-shadow: 0 8px 20px rgba(13, 148, 136, 0.2);
        }

        #btnMath.active .icon {
            background: #0d9488;
            color: #ffffff;
            transform: scale(1.1);
        }

        #btnTimss .icon {
            background: rgba(212, 160, 23, 0.12);
            color: #b8860b;
        }

        #btnTimss.active {
            background: linear-gradient(135deg, #fffcf0, #fef3c7);
            border-color: #d97706;
            color: #92400e;
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.2);
        }

        #btnTimss.active .icon {
            background: #d97706;
            color: #ffffff;
            transform: scale(1.1);
        }

        .exam-btn:hover {
            border-color: #002f6c;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: right;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            transition: color 0.3s ease;
        }
        
        .container.math-mode label {
            color: #0d9488;
        }
        
        .container.timss-mode label {
            color: #b45309;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            background: #f8fafc;
            border: 2.5px solid #cbd5e1;
            border-radius: 14px;
            color: #001a41;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 2px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #f59e0b;
            background: #ffffff;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }

        .actions-group {
            display: flex;
            gap: 12px;
        }

        button.submit-btn, button.print-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #ffffff;
        }

        button.print-btn {
            background: linear-gradient(135deg, #475569, #334155);
            box-shadow: 0 6px 20px rgba(71, 85, 105, 0.3);
            display: none;
        }

        button.print-btn:hover {

            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(71, 85, 105, 0.4);
        }

            box-shadow: 0 6px 20px rgba(13, 148, 136, 0.3);

        .container.math-mode button.submit-btn:hover {

            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(13, 148, 136, 0.4);
        }

        .container.timss-mode button.submit-btn {

            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.3);
        }

        .container.timss-mode button.submit-btn:hover {

            transform: translateY(-2px);

        button.submit-btn span.btn-icon, button.print-btn span.btn-icon {

        }

            border: 2.5px solid #86efac;

                box-shadow: none;

        function setExamType(type) {
            currentExam = type;
            const btnMath = document.getElementById('btnMath');
            const btnTimss = document.getElementById('btnTimss');
            const inputLabel = document.getElementById('inputLabel');
            const resultBox = document.getElementById('resultContainer');
            const printBtn = document.getElementById('printBtn');
            const mainContainer = document.getElementById('mainContainer');

            resultBox.style.display = "none";
            printBtn.style.display = "none";

            if (type === 'math') {
                btnMath.classList.add('active');
                btnTimss.classList.remove('active');
                inputLabel.innerText = "أدخل رقم الهوية لاختبار الفترة:";
                mainContainer.classList.remove('timss-mode');
                mainContainer.classList.add('math-mode');
            } else {
                btnTimss.classList.add('active');
                btnMath.classList.remove('active');
                inputLabel.innerText = "أدخل رقم الهوية لاختبارات تيمز (TIMSS):";
                mainContainer.classList.remove('math-mode');
                mainContainer.classList.add('timss-mode');
            }
        }

        function toArabicNumerals(num) {
            const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return num.toString().replace(/\d/g, (digit) => arabicNumbers[digit]);
        }

        function toEnglishNumerals(str) {
            return str.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));

        function playSound(type) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();

            if (type === 'applause') {
                for (let i = 0; i < 15; i++) {
                    setTimeout(() => {
                        const bufferSize = ctx.sampleRate * 0.08;
                        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                        const data = buffer.getChannelData(0);
                        for (let j = 0; j < bufferSize; j++) {
                            data[j] = Math.random() * 2 - 1;
                        }
                        const noise = ctx.createBufferSource();
                        noise.buffer = buffer;
                        const filter = ctx.createBiquadFilter();
                        filter.type = 'bandpass';
                        filter.frequency.value = 1000;
                        const gain = ctx.createGain();
                        gain.gain.setValueAtTime(0.3, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                        noise.connect(filter);
                        filter.connect(gain);
                        gain.connect(ctx.destination);
                        noise.start();
                    }, i * 60);
                }
            } else if (type === 'success') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, ctx.currentTime + index * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + index * 0.12 + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + index * 0.12);
                    osc.stop(ctx.currentTime + index * 0.12 + 0.3);
                });
            } else if (type === 'encouraging') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            }
        }

        function checkGrade() {
            let rawInput = document.getElementById('nationalId').value.trim();
            const idInput = toEnglishNumerals(rawInput);
            const resultBox = document.getElementById('resultContainer');
            const printBtn = document.getElementById('printBtn');

            if (idInput === "") {
                resultBox.style.display = "block";
                resultBox.className = "result-box error";
                resultBox.innerHTML = "<h3>تنبيه</h3><p style='text-align:center;'>الرجاء إدخال رقم الهوية الوطنية أو الإقامة.</p>";
                printBtn.style.display = "none";
                return;
            }

            if (studentsData[idInput]) {
                const student = studentsData[idInput];
                let score = null;
                let examName = "";
                let maxScore = 20;

                if (currentExam === 'math') {
                    score = student.mathScore;
                    examName = "اختبار الفترة الأولى";
                    maxScore = 20;
                } else {
                    score = student.timssScore;
                    examName = "اختبارات تيمز الدولية (TIMSS)";
                    maxScore = 10;
                }

                if (score === null || score === undefined) {
                    resultBox.style.display = "block";
                    resultBox.className = "result-box pending";
                    printBtn.style.display = "none";
                    resultBox.innerHTML = `
                        <h3>تفاصيل النتيجة</h3>
                        <div class="info-row">
                            <span>اسم الطالب:</span>
                            <strong>${student.name}</strong>
                        </div>
                        <div class="info-row">
                            <span>المادة الدراسية:</span>
                            <strong>الرياضيات</strong>
                        </div>
                        <div class="info-row">
                            <span>نوع الاختبار:</span>
                            <strong>${examName}</strong>
                        </div>

                        <div class="grade-badge">
                            لم يتم رصد الدرجات إلى الآن
                        </div>
                    `;
                    return;
                }

                if (score === "غائب") {
                    resultBox.style.display = "block";
                    resultBox.className = "result-box error";
                    printBtn.style.display = "flex";
                    resultBox.innerHTML = `
                        <h3>تفاصيل النتيجة</h3>
                        <div class="info-row">
                            <span>اسم الطالب:</span>
                            <strong>${student.name}</strong>
                        </div>
                        <div class="info-row">
                            <span>المادة الدراسية:</span>
                            <strong>الرياضيات</strong>
                        </div>
                        <div class="info-row">
                            <span>نوع الاختبار:</span>
                            <strong>${examName}</strong>
                        </div>

                        <div class="grade-badge" style="color: #7f1d1d; background: #fee2e2; border-color: #fca5a5;">
                            حالة الطالب: غائب عن الاختبار
                        </div>

                        <div class="feedback-box">
                            <strong>عذراً يا بطل! ⚠️</strong><br>
                            لم تقم بحضور هذا الاختبار. ننتظر تعويض ذلك في الاختبارات القادمة بمشيئة الله. 💪
                        </div>
                    `;
                    return;
                }

                let feedbackTitle = "";
                let feedbackMessage = "";

                const percentage = (score / maxScore) * 100;

                if (percentage >= 75) {
                    feedbackTitle = "ممتاز! 🌟";
                    feedbackMessage = "أبدعت وتألقت يا بطل! أداء استثنائي ينم عن فهم عميق. واصل هذا التميز والتألق دائماً! 👏✨";
                    playSound('applause');
                } else if (percentage >= 50) {
                    feedbackTitle = "أحسنت! 👍";
                    feedbackMessage = "عمل رائع! واصل الاجتهاد والتركيز وستصل إلى أعلى المستويات. 💪🚀";
                    playSound('success');
                } else { 
                    feedbackTitle = "خطوة نحو النجاح! 💡";
                    feedbackMessage = "لا تقلق يا بطل، البدايات دائمًا فرصة للتعلم والتطور. أنت تمتلك القدرة على التحسن في الاختبارات القادمة! 🌟🌱";
                    playSound('encouraging');
                }

                const maxScoreArabic = maxScore === 20 ? '٢٠' : '١٠';

                resultBox.style.display = "block";
                resultBox.className = "result-box success";
                printBtn.style.display = "flex";
                resultBox.innerHTML = `
                    <h3>تفاصيل النتيجة</h3>
                    <div class="info-row">
                        <span>اسم الطالب:</span>
                        <strong>${student.name}</strong>
                    </div>
                    <div class="info-row">
                        <span>المادة الدراسية:</span>
                        <strong>الرياضيات</strong>
                    </div>
                    <div class="info-row">
                        <span>نوع الاختبار:</span>
                        <strong>${examName}</strong>
                    </div>

                    <div class="grade-badge">
                        الدرجة: ${toArabicNumerals(score)} من ${maxScoreArabic}
                    </div>

                    <div class="feedback-box">
                        <strong>${feedbackTitle}</strong><br>
                        ${feedbackMessage}
                    </div>
                `;
            } else {
                resultBox.style.display = "block";
                resultBox.className = "result-box error";
                printBtn.style.display = "none";
                resultBox.innerHTML = `<h3>عذراً، لم يتم العثور على النتيجة</h3><p style='text-align:center;'>الرقم (${toArabicNumerals(idInput)}) غير مسجل في قوائم هذا الاختبار. تأكد من صحة الرقم المدخل.</p>`;
            }
        }
    </script>
