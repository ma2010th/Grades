<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج الطلاب في مادة الرياضيات - متوسطة عدي بن حاتم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #001a41, #002f6c);
            color: #102a43;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            border: 4px solid #ffcc00;
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 26, 65, 0.6);
            width: 100%;
            max-width: 650px;
            padding: 45px 35px;
            text-align: center;
        }
        h2 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            color: #001a41;
            font-weight: 900;
            text-shadow: 1px 1px 3px rgba(255, 204, 0, 0.25);
        }
        .subtitle {
            font-size: 1.15rem;
            color: #486581;
            margin-bottom: 25px;
            font-weight: 700;
        }
        
        .exam-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .exam-btn {
            flex: 1;
            padding: 16px 12px;
            background: #f8fafc;
            border: 2.5px solid #cbd5e1;
            border-radius: 16px;
            color: #486581;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .exam-btn span.icon {
            font-size: 1.8rem;
            padding: 10px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        #btnMath .icon {
            background: rgba(212, 160, 23, 0.12);
            color: #b8860b;
        }
        #btnMath.active {
            background: linear-gradient(135deg, #fffcf0, #fef3c7);
            border-color: #d97706;
            color: #92400e;
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.3);
        }
        #btnMath.active .icon {
            background: #d97706;
            color: #ffffff;
            transform: scale(1.1);
        }

        #btnTimss .icon {
            background: rgba(13, 148, 136, 0.12);
            color: #0d9488;
        }
        #btnTimss.active {
            background: linear-gradient(135deg, #f0fdfa, #ccfbf1);
            border-color: #0d9488;
            color: #115e59;
            box-shadow: 0 8px 20px rgba(13, 148, 136, 0.3);
        }
        #btnTimss.active .icon {
            background: #0d9488;
            color: #ffffff;
            transform: scale(1.1);
        }

        .exam-btn:hover {
            border-color: #001a41;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: right;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            transition: color 0.3s ease;
        }
        
        .container.math-mode label {
            color: #b45309;
        }
        
        .container.timss-mode label {
            color: #0d9488;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: #f8fafc;
            border: 2.5px solid #cbd5e1;
            border-radius: 14px;
            color: #001a41;
            font-size: 1.25rem;
            text-align: center;
            letter-spacing: 2px;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #ffcc00;
            background: #ffffff;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.45);
        }

        button.submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1.25rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #ffffff;
        }

        .container.math-mode button.submit-btn {
            background: linear-gradient(135deg, #d97706, #b45309);
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.4);
        }
        .container.math-mode button.submit-btn:hover {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(217, 119, 6, 0.6);
        }

        .container.timss-mode button.submit-btn {
            background: linear-gradient(135deg, #0d9488, #115e59);
            box-shadow: 0 6px 20px rgba(13, 148, 136, 0.4);
        }
        .container.timss-mode button.submit-btn:hover {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(13, 148, 136, 0.6);
        }

        button.submit-btn span.btn-icon {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 10px;
            border-radius: 50%;
            font-size: 1.1rem;
        }

        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 16px;
            display: none;
            animation: fadeIn 0.4s ease forwards;
            text-align: right;
        }
        .result-box.success {
            background: #f0fdf4;
            border: 2.5px solid #86efac;
            color: #14532d;
        }
        .result-box.error {
            background: #fef2f2;
            border: 2.5px solid #fca5a5;
            color: #7f1d1d;
        }
        .result-box.pending {
            background: #fffbeb;
            border: 2.5px solid #ffcc00;
            color: #7a5c00;
        }
        .result-box h3 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            text-align: center;
            color: #002f6c;
            font-weight: 900;
        }
        .result-box.pending h3 {
            color: #b38600;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 10px;
            margin-bottom: 12px;
            font-size: 1.05rem;
        }
        .info-row span {
            color: #486581;
            font-weight: 500;
        }
        .info-row strong {
            color: #001a41;
            font-weight: 700;
        }
        .grade-badge {
            display: block;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 900;
            color: #002f6c;
            background: rgba(0, 47, 108, 0.08);
            padding: 14px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1.5px solid rgba(0, 47, 108, 0.2);
        }
        .feedback-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 1.05rem;
            text-align: center;
            line-height: 1.6;
        }
        .footer {
            margin-top: 35px;
            font-size: 1rem;
            color: #627d98;
            text-align: center;
            border-top: 2.5px solid #e2e8f0;
            padding-top: 18px;
        }
        .footer span {
            color: #002f6c;
            font-weight: 900;
            font-size: 1.05rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 15px;
            }
            h2 {
                font-size: 1.8rem;
            }
            .exam-selector {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container math-mode" id="mainContainer">
        <h2>نتائج الطلاب في مادة الرياضيات</h2>
        <p class="subtitle">متوسطة عدي بن حاتم - النظام التفاعلي</p>
        
        <div class="exam-selector">
            <button type="button" class="exam-btn active" id="btnMath" onclick="setExamType('math')">
                <span class="icon">📐</span>
                <span>اختبار الفترة الأولى</span>
            </button>
            <button type="button" class="exam-btn" id="btnTimss" onclick="setExamType('timss')">
                <span class="icon">🎯</span>
                <span>اختبارات تيمز (TIMSS)</span>
            </button>
        </div>

        <div class="form-group">
            <label for="nationalId" id="inputLabel">أدخل رقم الهوية لاختبار الفترة الأولى:</label>
            <input type="text" id="nationalId" placeholder="مثال: 1234567890" inputmode="numeric">
        </div>
        
        <button class="submit-btn" onclick="checkGrade()">
            <span class="btn-icon">🔍</span>
            <span>عرض النتيجة</span>
        </button>

        <div id="resultContainer" class="result-box"></div>

        <div class="footer">
            إعداد وتنفيذ المعلم: <span>عبدالمحيي السلمي</span><br>
            <span style="font-size: 0.8rem; color: #829ab1; font-weight: 400;">جميع الحقوق محفوظة © ٢٠٢٦</span>
        </div>
    </div>

    <script>
        let currentExam = 'math';

        function setExamType(type) {
            currentExam = type;
            const btnMath = document.getElementById('btnMath');
            const btnTimss = document.getElementById('btnTimss');
            const inputLabel = document.getElementById('inputLabel');
            const resultBox = document.getElementById('resultContainer');
            const mainContainer = document.getElementById('mainContainer');

            resultBox.style.display = "none";

            if (type === 'math') {
                btnMath.classList.add('active');
                btnTimss.classList.remove('active');
                inputLabel.innerText = "أدخل رقم الهوية لاختبار الفترة الأولى:";
                mainContainer.classList.remove('timss-mode');
                mainContainer.classList.add('math-mode');
            } else {
                btnTimss.classList.add('active');
                btnMath.classList.remove('active');
                inputLabel.innerText = "أدخل رقم الهوية لاختبارات تيمز (TIMSS):";
                mainContainer.classList.remove('math-mode');
                mainContainer.classList.add('timss-mode');
            }
        }

        function toArabicNumerals(num) {
            const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return num.toString().replace(/\d/g, (digit) => arabicNumbers[digit]);
        }

        function toEnglishNumerals(str) {
            return str.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        }

        const studentsData = {
            "1234567890": { name: "طالب تجريبي (معاينة)", mathScore: 18, timssScore: 7 },
            "2363878220": { name: "علي محمد جمعه", mathScore: 20, timssScore: null },
            "1164647370": { name: "محمود عبده ابراهيم دراج", mathScore: 18, timssScore: null },
            "2366958771": { name: "صهيب فراس حسن كرم", mathScore: 20, timssScore: null },
            "1166072460": { name: "فيصل سامي عقيل العتيبي", mathScore: 19, timssScore: null },
            "1165678366": { name: "محمد بندر عبدالرحمن عبده جياش", mathScore: 19, timssScore: null },
            "1164001941": { name: "أوس احمد عبدالرحيم عبده", mathScore: 17, timssScore: null },
            "1164693259": { name: "محمد علي ابوطالب هزازي", mathScore: 16, timssScore: null },
            "1164766162": { name: "باسل محمد عاطي الحربي", mathScore: 16, timssScore: null },
            "1163846411": { name: "عمر رحاب محي الدين النعماني", mathScore: 13, timssScore: null },
            "1164884890": { name: "حاتم حسن بن علي عسيري", mathScore: 20, timssScore: null },
            "1164470195": { name: "خالد علي احمد الهجيني", mathScore: 16, timssScore: null },
            "2364051355": { name: "احمد صلاح صالح الهيج", mathScore: 19, timssScore: null },
            "2363909397": { name: "اياد محمد يونس طوطح", mathScore: 14, timssScore: null },
            "1166518967": { name: "زياد سامي محمد المالكي", mathScore: 11, timssScore: null },
            "2120392378": { name: "عبدالله خالد عبدالله محمد", mathScore: 9, timssScore: null },
            "1165134014": { name: "وسام أحمد مسفر العلياني", mathScore: 13, timssScore: null },
            "1164113191": { name: "راشد محمد ابراهيم حكمي", mathScore: 4, timssScore: null },
            "1164132803": { name: "فيصل علي وصل المحياوي", mathScore: 13, timssScore: null },
            "1165767672": { name: "فارس ماجد علي خليل", mathScore: 10, timssScore: null },
            "54677": { name: "علي عبدالله محمد عيسى", mathScore: 9, timssScore: null },
            "1166159770": { name: "عمر احمد محمد السالمي", mathScore: 6, timssScore: null },
            "1166559342": { name: "يزن هتان عبدالواحد الرابغي", mathScore: 10, timssScore: null },
            "1165634203": { name: "محمد منير صالح الثبيتي", mathScore: 8, timssScore: null },
            "2342791502": { name: "بدر ضيف الله الغامدي", mathScore: 9, timssScore: null },
            "1167034295": { name: "عمر عبدالله عويضة الشيخ", mathScore: 7, timssScore: null },
            "2365349964": { name: "فراس علي الغامدي", mathScore: 0, timssScore: null }
        };

        function playSound(type) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();

            if (type === 'applause') {
                for (let i = 0; i < 15; i++) {
                    setTimeout(() => {
                        const bufferSize = ctx.sampleRate * 0.08;
                        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                        const data = buffer.getChannelData(0);
                        for (let j = 0; j < bufferSize; j++) {
                            data[j] = Math.random() * 2 - 1;
                        }
                        const noise = ctx.createBufferSource();
                        noise.buffer = buffer;
                        const filter = ctx.createBiquadFilter();
                        filter.type = 'bandpass';
                        filter.frequency.value = 1000;
                        const gain = ctx.createGain();
                        gain.gain.setValueAtTime(0.3, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                        noise.connect(filter);
                        filter.connect(gain);
                        gain.connect(ctx.destination);
                        noise.start();
                    }, i * 60);
                }
            } else if (type === 'success') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, ctx.currentTime + index * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + index * 0.12 + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + index * 0.12);
                    osc.stop(ctx.currentTime + index * 0.12 + 0.3);
                });
            } else if (type === 'encouraging') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            }
        }

        function checkGrade() {
            let rawInput = document.getElementById('nationalId').value.trim();
            const idInput = toEnglishNumerals(rawInput);
            const resultBox = document.getElementById('resultContainer');

            if (idInput === "") {
                resultBox.style.display = "block";
                resultBox.className = "result-box error";
                resultBox.innerHTML = "<h3>تنبيه</h3><p style='text-align:center;'>الرجاء إدخال رقم الهوية الوطنية أو الإقامة.</p>";
                return;
            }

            if (studentsData[idInput]) {
                const student = studentsData[idInput];
                let score = null;
                let examName = "";
                let maxScore = 20;

                if (currentExam === 'math') {
                    score = student.mathScore;
                    examName = "اختبار الفترة الأولى";
                    maxScore = 20;
                } else {
                    score = student.timssScore;
                    examName = "اختبارات تيمز الدولية (TIMSS)";
                    maxScore = 10;
                }

                if (score === null || score === undefined) {
                    resultBox.style.display = "block";
                    resultBox.className = "result-box pending";
                    resultBox.innerHTML = `
                        <h3>تفاصيل النتيجة</h3>
                        <div class="info-row">
                            <span>اسم الطالب:</span>
                            <strong>${student.name}</strong>
                        </div>
                        <div class="info-row">
                            <span>نوع الاختبار:</span>
                            <strong>${examName}</strong>
                        </div>

                        <div class="grade-badge">
                            لم يتم رصد الدرجات إلى الآن
                        </div>
                    `;
                    return;
                }

                let feedbackTitle = "";
                let feedbackMessage = "";

                const percentage = (score / maxScore) * 100;

                if (percentage >= 75) {
                    feedbackTitle = "ممتاز! 🌟";
                    feedbackMessage = "أبدعت وتألقت يا بطل! أداء استثنائي ينم عن فهم عميق. واصل هذا التميز والتألق دائماً! 👏✨";
                    playSound('applause');
                } else if (percentage >= 50) {
                    feedbackTitle = "أحسنت! 👍";
                    feedbackMessage = "عمل رائع! واصل الاجتهاد والتركيز وستصل إلى أعلى المستويات. 💪🚀";
                    playSound('success');
                } else { 
                    feedbackTitle = "خطوة نحو النجاح! 💡";
                    feedbackMessage = "لا تقلق يا بطل، البدايات دائمًا فرصة للتعلم والتطور. أنت تمتلك القدرة على التحسن في الاختبارات القادمة! 🌟🌱";
                    playSound('encouraging');
                }

                const maxScoreArabic = maxScore === 20 ? '٢٠' : '١٠';

                resultBox.style.display = "block";
                resultBox.className = "result-box success";
                resultBox.innerHTML = `
                    <h3>تفاصيل النتيجة</h3>
                    <div class="info-row">
                        <span>اسم الطالب:</span>
                        <strong>${student.name}</strong>
                    </div>
                    <div class="info-row">
                        <span>نوع الاختبار:</span>
                        <strong>${examName}</strong>
                    </div>

                    <div class="grade-badge">
                        الدرجة: ${toArabicNumerals(score)} من ${maxScoreArabic}
                    </div>

                    <div class="feedback-box">
                        <strong>${feedbackTitle}</strong><br>
                        ${feedbackMessage}
                    </div>
                `;
            } else {
                resultBox.style.display = "block";
                resultBox.className = "result-box error";
                resultBox.innerHTML = `<h3>عذراً، لم يتم العثور على النتيجة</h3><p style='text-align:center;'>الرقم (${toArabicNumerals(idInput)}) غير مسجل في قوائم هذا الاختبار. تأكد من صحة الرقم المدخل.</p>`;
            }
        }
    </script>
</body>
</html>
